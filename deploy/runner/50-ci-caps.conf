# /etc/systemd/system/user-1002.slice.d/50-ci-caps.conf
# One combined cap for everything the deploy runner does on nfetestpi1 (BMS ADR-040): the runner
# (bmsdeploy-actions-runner.service, Slice=user-1002.slice) and bmsdeploy's user manager with its
# rootless dockerd and every container. The OpenEMS edge runs under root Docker in system.slice
# and is outside this cap.
# MemorySwapMax=0: zram's compressed pages are not charged to the cgroup, so letting CI swap
# would let it take more than 5.5G of real RAM from the edge.
# MemoryMax needs the memory controller: cgroup_enable=memory on the kernel command line.
[Slice]
MemoryMax=3500M
MemorySwapMax=0
CPUQuota=300%
TasksMax=4096
