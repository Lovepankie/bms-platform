# /etc/systemd/system/user.slice.d/50-user-slice-cap.conf  (BMS ADR-040)
# One cap over EVERY user slice on the staging host: the AGA runner (user-1001.slice, 5.5G), the deploy runner
# (user-1002.slice, 3.5G) and any login. Their separate caps add up to more than the 7.6 GB of RAM, so on their
# own they could not stop both runners together from starving the OpenEMS edge, which runs in system.slice
# and is outside this cap (about 1.6 GB in use, plus the bms staging stack). MemorySwapMax=0 for the reason
# given in 50-ci-caps.conf: zram pages are not charged to the cgroup.
[Slice]
MemoryMax=5500M
MemorySwapMax=0
