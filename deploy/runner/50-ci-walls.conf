# /etc/systemd/system/user@1002.service.d/50-ci-walls.conf
# Walls for bmsdeploy's user manager, which runs its rootless dockerd and therefore every CI
# container (BMS ADR-040, derived from the AGA ADR-030 walls of ghrunner). The runner service has its own,
# stricter sandbox; this one is what a container, or a transient `systemd-run --user` unit,
# cannot get out of.
#
# Deliberately absent, because rootless Docker needs them off:
#   NoNewPrivileges / RestrictSUIDSGID  - rootlesskit runs setuid newuidmap/newgidmap, and image
#                                         layers carry setuid files that dockerd must chmod
#   ProtectKernelTunables / ProtectKernelLogs / ProtectControlGroups / ProtectProc
#                                       - over-mounting /proc or /sys makes the kernel refuse a
#                                         container's own proc/sysfs mount (mount_too_revealing),
#                                         and the user manager writes its delegated cgroups
[Unit]
Requires=bmsdeploy-netwall.service
After=bmsdeploy-netwall.service

[Service]
InaccessiblePaths=-/opt -/home/nfetestpi1 -/root -/etc/docker -/var/lib/docker -/run/docker.sock -/run/containerd -/var/lib/containerd -/var/lib/zerotier-one -/etc/NetworkManager/system-connections -/boot -/var/log -/etc/sudoers.d
ProtectSystem=strict
ReadWritePaths=/home/bmsdeploy /run/user/1002 /tmp /var/tmp
DevicePolicy=closed
DeviceAllow=/dev/net/tun rw
DeviceAllow=/dev/fuse rw
DeviceAllow=/dev/ptmx rw
DeviceAllow=/dev/tty rw
DeviceAllow=char-pts rw
