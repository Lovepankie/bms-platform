# Recommended PostgreSQL settings for the production VM, 2 vCPU and 4 GB (chapter 9 section 9.4,
# ADR-028, issue #107).
#
# NOT applied by anything: compose.yml passes its settings with `-c` and stays the source of
# truth. The values below were measured with scripts/db-bench at 25 times the staging data inside a
# 1280 MB container with two CPUs; production hardware (disk, CPU) was not available, so latency
# there will differ. Change the host only through docs/runbooks/database-tuning.md.

# --- Kept as compose.yml sets them (measured, ADR-028) ----------------------------------------
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB
max_connections = 60               # pool 10 per API instance; room for a second instance and tools

# --- Recommended additions (not measured: production disk not available) -----------------------
# random_page_cost = 1.1           # only once the VM's disk is confirmed SSD; re-run db-bench after

# --- Diagnostics: pg_stat_statements is cheap enough to keep on in production -----------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
