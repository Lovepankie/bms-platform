# Recommended PostgreSQL settings for the ARM64 staging host (ADR-018, ADR-028, issue #107).
#
# NOT applied by anything: compose.pi-staging.yml passes its settings with `-c` and stays the
# source of truth. This file records what was measured with scripts/db-bench at 25 times the
# staging data under these limits (176 MB container, one CPU) and what is recommended on top.
# Change the host only through docs/runbooks/database-tuning.md, one setting at a time.
#
# Budget inside the 176 MB container: shared_buffers 48 MB, five API connections, the migrate
# container's one connection during a deploy, a backup or an operator's psql session, and the
# background workers. Autovacuum is the largest variable: each worker may use up to
# autovacuum_work_mem (by default maintenance_work_mem, 32 MB here) while it vacuums a large table.

# --- Kept as compose.pi-staging.yml sets them (measured, ADR-028) ------------------------------
shared_buffers = 48MB
effective_cache_size = 128MB
work_mem = 2MB                     # 16MB measured: year profit report 418 to 335 ms only (ADR-028)
maintenance_work_mem = 32MB        # V26 index builds measured with this value
max_connections = 20               # pool 5 + migrate 1 + backup 1 + an operator, with room
wal_buffers = 4MB
checkpoint_timeout = 15min
max_wal_size = 256MB

# --- Recommended additions (reasoned from the memory budget, not measured on the host) ---------
autovacuum_max_workers = 2         # default 3; two workers at 16 MB each fit next to the buffers
autovacuum_work_mem = 16MB         # PostgreSQL 17 stores dead tuples compactly; 16 MB is ample here

# --- Left at the default (measured without effect, ADR-028) -----------------------------------
# jit = on, max_parallel_workers_per_gather = 2: no consistent difference on the staging settings.

# --- Diagnostics, off by default (docs/runbooks/database-tuning.md section 2) -----------------
# shared_preload_libraries = 'pg_stat_statements'
# pg_stat_statements.max = 1000
# pg_stat_statements.track = top
