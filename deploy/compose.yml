# Production VM stack (docs/sdd/09-infrastructure-design.md, ADR-006). The ARM64 staging host uses
# compose.pi-staging.yml instead (ADR-018). Lives on the host
# as /opt/bms/compose.yml next to /opt/bms/.env; deploy.sh drives it. The application images are
# named by API_IMAGE, WEB_IMAGE and PROXY_IMAGE, set by deploy.sh after it verifies each image's
# cosign signature and resolves it to its digest (image@sha256:..., ADR-018 finding H2), so the
# bytes verified are the bytes run; the others use the pinned values in .env. Nothing is ever built
# on the host.
#
# Secrets reach only the service that needs them: the API gets the bms_app password and never the
# owner's; only the one-shot migrate container gets bms_owner.

name: bms

x-app-image: &api-image ${API_IMAGE:?API_IMAGE is set by deploy.sh}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?pin it in .env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      BMS_OWNER_PASSWORD: ${BMS_OWNER_PASSWORD:?}
      BMS_APP_PASSWORD: ${BMS_APP_PASSWORD:?}
    # Sized for a 4 GB VM next to one API JVM (section 9.4).
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
    mem_limit: 1280m
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bms"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: `docker compose run --rm migrate`, run by deploy.sh before the app switches.
  migrate:
    image: *api-image
    profiles: ["migrate"]
    command: ["migrate"]
    restart: "no"
    environment:
      BMS_DB_URL: jdbc:postgresql://postgres:5432/bms
      BMS_OWNER_USER: bms_owner
      BMS_OWNER_PASSWORD: ${BMS_OWNER_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *api-image
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: server
      BMS_DB_URL: jdbc:postgresql://postgres:5432/bms
      BMS_APP_USER: bms_app
      BMS_APP_PASSWORD: ${BMS_APP_PASSWORD:?}
      BMS_DB_POOL_SIZE: ${BMS_DB_POOL_SIZE:-10}
      BMS_DB_STATEMENT_TIMEOUT: ${BMS_DB_STATEMENT_TIMEOUT:-60s}
      BMS_DB_IDLE_IN_TRANSACTION_TIMEOUT: ${BMS_DB_IDLE_IN_TRANSACTION_TIMEOUT:-60s}
      BMS_TENANT_HOST_PATTERN: ${BMS_TENANT_HOST_PATTERN:?}
      BMS_PLATFORM_HOST: ${BMS_PLATFORM_HOST:?}
      BMS_SCHEDULER_ENABLED: ${BMS_SCHEDULER_ENABLED:-true}
      BMS_OPENAPI_ENABLED: ${BMS_OPENAPI_ENABLED:-false}
      # Staff and platform sign-in keys (chapter 8 section 8.7, ADR-014); the API refuses to start
      # without them. Generate with: docker run --rm <api image> keys
      BMS_TOKEN_SIGNING_JWK: ${BMS_TOKEN_SIGNING_JWK:?}
      BMS_DATA_KEY: ${BMS_DATA_KEY:?}
      BMS_DATA_KEY_ID: ${BMS_DATA_KEY_ID:-k1}
      R2_ENDPOINT: ${R2_ENDPOINT:?}
      R2_DOCUMENTS_ACCESS_KEY_ID: ${R2_DOCUMENTS_ACCESS_KEY_ID:?}
      R2_DOCUMENTS_SECRET_ACCESS_KEY: ${R2_DOCUMENTS_SECRET_ACCESS_KEY:?}
      R2_DOCUMENTS_BUCKET: ${R2_DOCUMENTS_BUCKET:?}
      # Outbox senders (spec section 11, chapter 9 section 9.8). Optional: a sender whose values
      # are empty stays off and its messages wait in the outbox. SMTP is implicit TLS on 465 (587 is
      # blocked on the staging host).
      BMS_SMTP_HOST: ${BMS_SMTP_HOST:-}
      BMS_SMTP_PORT: ${BMS_SMTP_PORT:-465}
      BMS_SMTP_USER: ${BMS_SMTP_USER:-}
      BMS_SMTP_PASSWORD: ${BMS_SMTP_PASSWORD:-}
      BMS_MAIL_FROM: ${BMS_MAIL_FROM:-}
      BMS_TELEGRAM_BOT_TOKEN: ${BMS_TELEGRAM_BOT_TOKEN:-}
      BMS_TELEGRAM_OPERATOR_CHAT_ID: ${BMS_TELEGRAM_OPERATOR_CHAT_ID:-}
      # Global sign-up caps per hour (chapter 7 section 7.10); defaults 30 and 60.
      BMS_SIGNUP_MAX_APPLICATIONS_PER_HOUR: ${BMS_SIGNUP_MAX_APPLICATIONS_PER_HOUR:-30}
      BMS_SIGNUP_MAX_VERIFICATION_EMAILS_PER_HOUR: ${BMS_SIGNUP_MAX_VERIFICATION_EMAILS_PER_HOUR:-60}
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    # /readyz is healthy only when the database is reachable and migrations are at head. The
    # JRE image has no curl, so the probe speaks HTTP over bash's /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3 && head -n1 <&3 | grep -q '' 200 '''
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 90s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is set by deploy.sh}
    restart: unless-stopped
    environment:
      BMS_TENANT_HOST_PATTERN: ${BMS_TENANT_HOST_PATTERN:?}
      BMS_PLATFORM_HOST: ${BMS_PLATFORM_HOST:?}
    mem_limit: 64m

  proxy:
    image: ${PROXY_IMAGE:?PROXY_IMAGE is set by deploy.sh}
    restart: unless-stopped
    environment:
      BMS_DNS_ZONE: ${BMS_DNS_ZONE:?}
      BMS_CALLBACK_HOST: ${BMS_CALLBACK_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
