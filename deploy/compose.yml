# Staging and production stack (docs/sdd/09-infrastructure-design.md, ADR-006). Lives on the host
# as /opt/bms/compose.yml next to /opt/bms/.env; deploy.sh drives it. Every image is a pinned tag:
# the application images use IMAGE_TAG (sha-<short> or vX.Y.Z, set by deploy.sh), the others use
# the pinned values in .env. Nothing is ever built on the host.
#
# Secrets reach only the service that needs them: the API gets the bms_app password and never the
# owner's; only the one-shot migrate container gets bms_owner.

name: bms

x-app-image: &api-image ghcr.io/rincoltech-solutions-ltd/bms-platform-api:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?pin it in .env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      BMS_OWNER_PASSWORD: ${BMS_OWNER_PASSWORD:?}
      BMS_APP_PASSWORD: ${BMS_APP_PASSWORD:?}
    # Sized for a 4 GB VM next to one API JVM (section 9.4).
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
    mem_limit: 1280m
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bms"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: `docker compose run --rm migrate`, run by deploy.sh before the app switches.
  migrate:
    image: *api-image
    profiles: ["migrate"]
    command: ["migrate"]
    restart: "no"
    environment:
      BMS_DB_URL: jdbc:postgresql://postgres:5432/bms
      BMS_OWNER_USER: bms_owner
      BMS_OWNER_PASSWORD: ${BMS_OWNER_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *api-image
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: server
      BMS_DB_URL: jdbc:postgresql://postgres:5432/bms
      BMS_APP_USER: bms_app
      BMS_APP_PASSWORD: ${BMS_APP_PASSWORD:?}
      BMS_DB_POOL_SIZE: ${BMS_DB_POOL_SIZE:-10}
      BMS_BASE_DOMAIN: ${BMS_BASE_DOMAIN:?}
      BMS_SCHEDULER_ENABLED: ${BMS_SCHEDULER_ENABLED:-true}
      BMS_OPENAPI_ENABLED: ${BMS_OPENAPI_ENABLED:-false}
      # Staff and platform sign-in keys (chapter 8 section 8.7, ADR-014); the API refuses to start
      # without them. Generate with: docker run --rm <api image> keys
      BMS_TOKEN_SIGNING_JWK: ${BMS_TOKEN_SIGNING_JWK:?}
      BMS_DATA_KEY: ${BMS_DATA_KEY:?}
      BMS_DATA_KEY_ID: ${BMS_DATA_KEY_ID:-k1}
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    # /readyz is healthy only when the database is reachable and migrations are at head. The
    # JRE image has no curl, so the probe speaks HTTP over bash's /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3 && head -n1 <&3 | grep -q '' 200 '''
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 90s

  web:
    image: ghcr.io/rincoltech-solutions-ltd/bms-platform-web:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 64m

  proxy:
    image: ghcr.io/rincoltech-solutions-ltd/bms-platform-proxy:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      BMS_BASE_DOMAIN: ${BMS_BASE_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
