# Staging stack for the shared ARM64 home host (ADR-018, docs/sdd/09-infrastructure-design.md
# section 9.13). The puller (pull-staging.sh) installs this file on the host as
# /opt/bms/compose.yml next to /opt/bms/.env, so deploy.sh, backup.sh and every runbook command
# work unchanged. Every image is multi-arch and pinned: the application images are named by
# API_IMAGE, WEB_IMAGE and PROXY_IMAGE, set by deploy.sh after it verifies each image's cosign
# signature against the committed deploy/cosign.pub and resolves it to its digest
# (image@sha256:..., ADR-018 finding H2), so the bytes verified are the bytes run. The others use
# the pinned values in .env. Nothing is built here.
#
# No service publishes a port. The only way in is the Cloudflare Tunnel: cloudflared dials out to
# Cloudflare, which terminates TLS for *.rincoltech.com, and delivers plain HTTP to one internal
# origin, the proxy service (Caddyfile.tunnel), which serves the PWA and proxies /api to the API.
#
# Two internal networks (ADR-018 finding M6): cloudflared reaches only the proxy, never postgres or
# the api's management port, so a wrong tunnel ingress rule or a leaked onboarding token cannot
# expose the database or the actuator directly.
#
# Memory budget: about 900 MB for all of BMS staging on a host it shares with other workloads.
# Every container runs under the systemd slice bms.slice (deploy/systemd/bms.slice), whose
# MemoryMax=900M is the hard cap for the whole stack, including the one-shot migrate container.
# The per-container limits below add up to 736 MB steady, 896 MB while a migration runs:
#
#   postgres 176  api 448  web 32  proxy 32  cloudflared 48  (migrate 160, only during a deploy;
#   keep-assets 32 runs alone, before the switch, ADR-078)

name: bms

x-app-image: &api-image ${API_IMAGE:?API_IMAGE is set by deploy.sh}

networks:
  edge:
  internal:

x-capped: &capped
  restart: unless-stopped
  cgroup_parent: bms.slice
  security_opt:
    - no-new-privileges:true
  logging:
    # The host's storage is an SD card: keep container logs small.
    driver: local
    options:
      max-size: 5m
      max-file: "2"

services:
  postgres:
    <<: *capped
    image: ${POSTGRES_IMAGE:?pin it in .env}
    networks: [internal]
    # No cap_drop here: the official image's entrypoint starts as root to chown and initialise the
    # data volume before it drops to the postgres user, so it still needs the default capability set
    # (ADR-018 finding L3 lists api, web, proxy and cloudflared, not postgres, for this reason).
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      BMS_OWNER_PASSWORD: ${BMS_OWNER_PASSWORD:?}
      BMS_APP_PASSWORD: ${BMS_APP_PASSWORD:?}
    # Sized for fabricated staging data inside 176 MB; fewer writes to the SD card.
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - wal_buffers=4MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=256MB
      # Terse error lines: no DETAIL, so a refused duplicate never prints its key value (ADR-059).
      - -c
      - log_error_verbosity=terse
    mem_limit: 176m
    cpus: 1.0
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bms"]
      interval: 10s
      timeout: 5s
      retries: 20

  # One-shot: `docker compose run --rm migrate`, run by deploy.sh before the app switches.
  migrate:
    image: *api-image
    profiles: ["migrate"]
    command: ["migrate"]
    restart: "no"
    cgroup_parent: bms.slice
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal]
    environment:
      BMS_DB_URL: jdbc:postgresql://postgres:5432/bms
      BMS_OWNER_USER: bms_owner
      BMS_OWNER_PASSWORD: ${BMS_OWNER_PASSWORD:?}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError
    mem_limit: 160m
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *capped
    image: *api-image
    networks: [internal]
    cap_drop: [ALL]
    environment:
      SPRING_PROFILES_ACTIVE: server
      BMS_DB_URL: jdbc:postgresql://postgres:5432/bms
      BMS_APP_USER: bms_app
      BMS_APP_PASSWORD: ${BMS_APP_PASSWORD:?}
      BMS_DB_POOL_SIZE: ${BMS_DB_POOL_SIZE:-5}
      BMS_DB_STATEMENT_TIMEOUT: ${BMS_DB_STATEMENT_TIMEOUT:-60s}
      BMS_DB_IDLE_IN_TRANSACTION_TIMEOUT: ${BMS_DB_IDLE_IN_TRANSACTION_TIMEOUT:-60s}
      BMS_TENANT_HOST_PATTERN: ${BMS_TENANT_HOST_PATTERN:?}
      BMS_PLATFORM_HOST: ${BMS_PLATFORM_HOST:?}
      BMS_SCHEDULER_ENABLED: ${BMS_SCHEDULER_ENABLED:-true}
      BMS_OPENAPI_ENABLED: ${BMS_OPENAPI_ENABLED:-true}
      BMS_TOKEN_SIGNING_JWK: ${BMS_TOKEN_SIGNING_JWK:?}
      BMS_DATA_KEY: ${BMS_DATA_KEY:?}
      BMS_DATA_KEY_ID: ${BMS_DATA_KEY_ID:-k1}
      BMS_DATA_KEY_PREVIOUS: ${BMS_DATA_KEY_PREVIOUS:-}
      # Sign-in limits (ADR-059); two hashes at once on the small staging heap.
      BMS_AUTH_SIGN_IN_FAILURES_PER_IP: ${BMS_AUTH_SIGN_IN_FAILURES_PER_IP:-300}
      BMS_AUTH_ARGON2_MAX_CONCURRENT: ${BMS_AUTH_ARGON2_MAX_CONCURRENT:-2}
      # Documents bucket (chapter 12 section 12.5): its own token, never the backup one. The API
      # refuses to start with any of these empty.
      R2_ENDPOINT: ${R2_ENDPOINT:?}
      R2_DOCUMENTS_ACCESS_KEY_ID: ${R2_DOCUMENTS_ACCESS_KEY_ID:?}
      R2_DOCUMENTS_SECRET_ACCESS_KEY: ${R2_DOCUMENTS_SECRET_ACCESS_KEY:?}
      R2_DOCUMENTS_BUCKET: ${R2_DOCUMENTS_BUCKET:?}
      # Outbox senders (spec section 11, chapter 9 section 9.8). Optional: a sender whose values
      # are empty stays off and its messages wait in the outbox. SMTP is implicit TLS on 465 (587 is
      # blocked on the staging host).
      BMS_SMTP_HOST: ${BMS_SMTP_HOST:-}
      BMS_SMTP_PORT: ${BMS_SMTP_PORT:-465}
      BMS_SMTP_USER: ${BMS_SMTP_USER:-}
      BMS_SMTP_PASSWORD: ${BMS_SMTP_PASSWORD:-}
      BMS_MAIL_FROM: ${BMS_MAIL_FROM:-}
      # The support line in the footer of every email (issue #396, ADR-054); empty leaves it out.
      BMS_SUPPORT_CONTACT: ${BMS_SUPPORT_CONTACT:-}
      BMS_TELEGRAM_BOT_TOKEN: ${BMS_TELEGRAM_BOT_TOKEN:-}
      BMS_TELEGRAM_OPERATOR_CHAT_ID: ${BMS_TELEGRAM_OPERATOR_CHAT_ID:-}
      # SMS (ADR-036, docs/runbooks/sms-setup.md). Off unless a mode and a provider are set; staging
      # defaults to the sink, which texts nobody. BMS_ENVIRONMENT decides what the startup guard allows:
      # the staging file fixes it to staging, so a missing or wrong value in .env cannot turn the guard off.
      BMS_ENVIRONMENT: staging
      BMS_SMS_PROVIDER: ${BMS_SMS_PROVIDER:-}
      BMS_SMS_MODE: ${BMS_SMS_MODE:-}
      BMS_SMS_ALLOWLIST: ${BMS_SMS_ALLOWLIST:-}
      BMS_SMS_PLATFORM_DAILY_CAP: ${BMS_SMS_PLATFORM_DAILY_CAP:-2000}
      BMS_SMS_AT_BASE_URL: ${BMS_SMS_AT_BASE_URL:-}
      BMS_SMS_AT_USERNAME: ${BMS_SMS_AT_USERNAME:-}
      BMS_SMS_AT_API_KEY: ${BMS_SMS_AT_API_KEY:-}
      # Web Push (ADR-050). Off unless both VAPID keys are set (docs/runbooks/push-notifications.md).
      BMS_PUSH_VAPID_PUBLIC_KEY: ${BMS_PUSH_VAPID_PUBLIC_KEY:-}
      BMS_PUSH_VAPID_PRIVATE_KEY: ${BMS_PUSH_VAPID_PRIVATE_KEY:-}
      BMS_PUSH_SUBJECT: ${BMS_PUSH_SUBJECT:-}
      BMS_PUSH_EXTRA_ENDPOINT_HOSTS: ${BMS_PUSH_EXTRA_ENDPOINT_HOSTS:-}
      # Language model gateway (ADR-037). Off unless BMS_AI_PROVIDER is openai_compatible and the base URL,
      # key and model are set; the allow-list names the tenants that may switch the assistant on.
      BMS_AI_PROVIDER: ${BMS_AI_PROVIDER:-off}
      BMS_AI_BASE_URL: ${BMS_AI_BASE_URL:-}
      BMS_AI_API_KEY: ${BMS_AI_API_KEY:-}
      BMS_AI_MODEL: ${BMS_AI_MODEL:-}
      BMS_AI_ENABLED_TENANTS: ${BMS_AI_ENABLED_TENANTS:-}
      BMS_PESAPAL_PROVIDER: ${BMS_PESAPAL_PROVIDER:-}
      BMS_PESAPAL_BASE_URL: ${BMS_PESAPAL_BASE_URL:-}
      BMS_PESAPAL_CALLBACK_BASE_URL: ${BMS_PESAPAL_CALLBACK_BASE_URL:-}
      BMS_PESAPAL_REFUSED_KEY_DIGESTS: ${BMS_PESAPAL_REFUSED_KEY_DIGESTS:-}
      BMS_PESAPAL_PLATFORM_CONSUMER_KEY: ${BMS_PESAPAL_PLATFORM_CONSUMER_KEY:-}
      BMS_PESAPAL_PLATFORM_CONSUMER_SECRET: ${BMS_PESAPAL_PLATFORM_CONSUMER_SECRET:-}
      BMS_PESAPAL_PLATFORM_IPN_ID: ${BMS_PESAPAL_PLATFORM_IPN_ID:-}
      BMS_PESAPAL_PLATFORM_IPN_TOKEN: ${BMS_PESAPAL_PLATFORM_IPN_TOKEN:-}
      BMS_AI_PLATFORM_DAILY_TOKENS: ${BMS_AI_PLATFORM_DAILY_TOKENS:-200000}
      BMS_AI_PLATFORM_DAILY_COST_MICRO: ${BMS_AI_PLATFORM_DAILY_COST_MICRO:-2000000}
      BMS_AI_PRICE_INPUT_MICRO_PER_MILLION: ${BMS_AI_PRICE_INPUT_MICRO_PER_MILLION:-0}
      BMS_AI_PRICE_OUTPUT_MICRO_PER_MILLION: ${BMS_AI_PRICE_OUTPUT_MICRO_PER_MILLION:-0}
      BMS_AI_PRICE_CURRENCY: ${BMS_AI_PRICE_CURRENCY:-USD}
      # Optional tuning; empty means the application's default. 0 is a daily cap that stops every call.
      BMS_AI_TENANT_DAILY_TOKENS: ${BMS_AI_TENANT_DAILY_TOKENS:-}
      BMS_AI_TENANT_DAILY_COST_MICRO: ${BMS_AI_TENANT_DAILY_COST_MICRO:-}
      BMS_AI_BUDGET_SECONDS: ${BMS_AI_BUDGET_SECONDS:-}
      BMS_AI_MAX_TOKENS_PER_CALL: ${BMS_AI_MAX_TOKENS_PER_CALL:-}
      BMS_AI_MAX_INPUT_TOKENS_PER_CALL: ${BMS_AI_MAX_INPUT_TOKENS_PER_CALL:-}
      # Global sign-up caps per hour (chapter 7 section 7.10); defaults 30 and 60.
      BMS_SIGNUP_MAX_APPLICATIONS_PER_HOUR: ${BMS_SIGNUP_MAX_APPLICATIONS_PER_HOUR:-30}
      BMS_SIGNUP_MAX_VERIFICATION_EMAILS_PER_HOUR: ${BMS_SIGNUP_MAX_VERIFICATION_EMAILS_PER_HOUR:-60}
      # Report runs (ADR-038): the 224 MB heap of this host sets one run at a time, 20000 rows a table, 500 rows in a
      # PDF and 8 MiB a file (docs/specs/client-extras.md section 6.3). Not secrets.
      BMS_REPORTS_MAX_CONCURRENT_RUNS: ${BMS_REPORTS_MAX_CONCURRENT_RUNS:-1}
      BMS_REPORTS_XLSX_ROW_CAP: ${BMS_REPORTS_XLSX_ROW_CAP:-20000}
      BMS_REPORTS_PDF_ROW_CAP: ${BMS_REPORTS_PDF_ROW_CAP:-500}
      BMS_REPORTS_MAX_FILE_BYTES: ${BMS_REPORTS_MAX_FILE_BYTES:-8388608}
      # A small JVM for a 448 MB container: serial GC, C1 only (less memory and CPU on a Pi, slower
      # peak throughput, which staging does not need), a capped code cache and few request threads.
      # Metaspace is 128m rather than 160m (ADR-018 finding L6): heap (224m) + metaspace (128m) +
      # code cache (48m) is 400m, leaving about 48m of headroom for thread stacks, GC structures,
      # direct buffers and the JDBC driver before the 448m container limit.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=20 -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k
        -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom
      SERVER_TOMCAT_THREADS_MAX: "24"
    mem_limit: 448m
    # Report runs (ADR-038): a stop interrupts the running reports and gives them 15 seconds to close; Docker would kill at 10.
    stop_grace_period: 30s
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3 && head -n1 <&3 | grep -q '' 200 '''
      interval: 10s
      timeout: 5s
      retries: 3
      # The JVM starts in about a minute on a Pi 4.
      start_period: 180s

  web:
    <<: *capped
    image: ${WEB_IMAGE:?WEB_IMAGE is set by deploy.sh}
    networks: [internal]
    cap_drop: [ALL]
    # The caddy binary carries the file capability cap_net_bind_service; with every capability
    # dropped the kernel refuses to exec it (EPERM). Adding back this one is enough.
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    environment:
      BMS_TENANT_HOST_PATTERN: ${BMS_TENANT_HOST_PATTERN:?}
      BMS_PLATFORM_HOST: ${BMS_PLATFORM_HOST:?}
    mem_limit: 32m
    cpus: 0.5
    # Hashed files of earlier builds, read-only; the Caddyfile falls back to them (ADR-078).
    volumes:
      - type: volume
        source: web_assets
        target: /srv/previous
        read_only: true
        volume:
          nocopy: true

  # One-shot: deploy.sh runs it with the OUTGOING web image just before web is replaced (ADR-078).
  # It copies that build's hashed files into web_assets, where the new web container still serves
  # them, so a phone on the previous app copy keeps loading its screens; it first removes files that
  # left the live build more than BMS_KEEP_ASSETS_DAYS days ago, then copies, refreshing the date of a
  # file it already holds. Hashed names never clash, so nothing is ever overwritten.
  keep-assets:
    cgroup_parent: bms.slice
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    mem_limit: 32m
    image: ${KEEP_ASSETS_IMAGE:-${WEB_IMAGE:?WEB_IMAGE is set by deploy.sh}}
    profiles: ["keep-assets"]
    restart: "no"
    # Root (with no capability) only to write the volume, which Docker creates root-owned; no network, nothing else.
    user: "0:0"
    network_mode: none
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        case "$${KEEP_DAYS}" in
          ''|*[!0-9]*) echo "BMS_KEEP_ASSETS_DAYS is not a whole number of days: '$${KEEP_DAYS}'" >&2; exit 1 ;;
        esac
        # Prune first, so the copy never raises the peak; -mmin, since -mtime +14 means 15 whole days.
        find /previous -type f \( -name '*.part' -o -mmin +$$(( KEEP_DAYS * 1440 )) \) -delete
        find /previous -mindepth 1 -type d -empty -delete
        cd /srv
        { find assets -type f; find . -maxdepth 1 -type f -name 'workbox-*.js' | sed 's|^\./||'; } |
          while IFS= read -r f; do
            if [ -e "/previous/$$f" ]; then
              touch "/previous/$$f"
              continue
            fi
            mkdir -p "/previous/$$(dirname "$$f")"
            cp "$$f" "/previous/$$f.part" || { rm -f "/previous/$$f.part"; exit 1; }
            mv "/previous/$$f.part" "/previous/$$f"
          done
        echo "kept $$(find /previous -type f | wc -l) hashed files of earlier builds ($$(du -sh /previous | cut -f1))"
    environment:
      KEEP_DAYS: ${BMS_KEEP_ASSETS_DAYS:-14}
    volumes:
      - web_assets:/previous

  # The one internal origin of the tunnel: the proxy image with its tunnel configuration. On both
  # networks, since it is the only service the edge network's cloudflared may reach (ADR-018 M6).
  proxy:
    <<: *capped
    image: ${PROXY_IMAGE:?PROXY_IMAGE is set by deploy.sh}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.tunnel", "--adapter", "caddyfile"]
    networks: [edge, internal]
    user: "10001:10001"
    cap_drop: [ALL]
    # The caddy binary carries the file capability cap_net_bind_service; with every capability
    # dropped the kernel refuses to exec it (EPERM). Adding back this one is enough.
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    mem_limit: 32m
    cpus: 0.5
    depends_on:
      - api
      - web

  cloudflared:
    <<: *capped
    image: ${CLOUDFLARED_IMAGE:?pin it in .env}
    command: ["tunnel", "--no-autoupdate", "run"]
    networks: [edge]
    cap_drop: [ALL]
    environment:
      # The tunnel's connector token (Cloudflare Zero Trust, Networks, Tunnels). Its public
      # hostnames point at http://proxy:8080 (docs/runbooks/provision-host.md section 8).
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    mem_limit: 48m
    cpus: 0.5
    depends_on:
      - proxy

volumes:
  pgdata:
  web_assets:
