name: Deploy

# The delivery pipeline of ADR-006 and ADR-018 (docs/sdd/10-cicd-pipeline.md):
#
#   push to main  -> build api, web and proxy images ONCE, for linux/amd64 and linux/arm64, tag
#                    sha-<short>, push to GHCR, sign each pushed digest with cosign
#                 -> move the `staging` pointer tag to those images. The ARM64 staging host sits
#                    behind a Cloudflare Tunnel and cannot be reached from here: its systemd timer
#                    (deploy/pull-staging.sh) sees the pointer move, verifies the cosign signatures
#                    and deploys the sha-<short> tag the image's labels name (ADR-018). No SSH key,
#                    no inbound access.
#   tag vX.Y.Z    -> no rebuild: the sha-<short> images of the tagged commit are retagged vX.Y.Z (the
#                    cosign signature, made against the manifest digest, already covers the new tag)
#                 -> deploy to the `production` environment (required reviewer: dev lead) over SSH
#
# The production VM is not provisioned yet: its deploy job checks the environment's HOST and
# SSH_KEY secrets and, when either is missing, reports a notice and succeeds.
#
# Only pushes to this repository's main branch and version tags trigger it. Pull requests never do,
# so code from a fork never runs with these secrets or with package write access.
#
# Every job below runs on the GitHub-hosted `ubuntu-latest` runner: a fresh, ephemeral virtual
# machine that is destroyed after the job. The self-hosted `hillary-pi` runner, which lives on the
# staging host itself, runs only the read-only checks in ci.yml, dash-guard.yml,
# adr-citation-guard.yml, architecture-model.yml, linked-issue-guard.yml and estimate-guard.yml. It
# never sees `packages: write`, a registry credential or a deploy secret (pending ADR-018 amendment,
# finding H1 of docs/reviews/pr-21-adversarial-review.md): a persistent runner that also executes
# unreviewed pull request code cannot be trusted with a token that a job on the same machine, on a
# later push, could read back out of its own state.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/rincoltech-solutions-ltd/bms-platform

jobs:
  meta:
    name: Resolve tags
    if: github.repository == 'RincolTech-Solutions-ltd/bms-platform'
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tags
        run: |
          commit="$(git rev-parse HEAD)"
          echo "sha_tag=sha-${commit:0:7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release tags are vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME"
              exit 1
            fi
            # Only a commit that reached main (and therefore staging) can be released.
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
              exit 1
            fi
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push ${{ matrix.image }}
    needs: meta
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
          - image: proxy
            context: deploy
            file: deploy/caddy/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # Every Dockerfile compiles in a stage pinned to $BUILDPLATFORM (Maven, npm and a Go
      # cross-compile run natively where possible), and the per-target runtime stages have no RUN
      # step, so no emulated code ever executes. This hosted runner is amd64 only, so QEMU is
      # registered to let buildx assemble the linux/arm64 manifest (layer copies only, still no
      # emulated RUN); unlike the walled Pi runner, the hosted one is allowed the privilege
      # (owner decision H1, pending ADR-018 amendment).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version and revision labels are what the staging host's puller reads from the
      # `staging` pointer to find the release and the commit of its host files (ADR-018).
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.meta.outputs.sha_tag }}
          build-args: GIT_SHA=${{ needs.meta.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.sha_tag }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      # H2: sign the pushed manifest by digest with a private key. --tlog-upload=false keeps the
      # signature out of the public Rekor transparency log (a public log entry would name this
      # private repository's images and commit shas). The signature is an OCI artifact pushed next
      # to the image in GHCR, so it needs the same packages: write used to push the image.
      - name: Sign the image digest with cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"
      - env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign --key cosign.key --tlog-upload=false --yes \
            "${IMAGE_PREFIX}-${{ matrix.image }}@${DIGEST}"
          rm -f cosign.key

  staging-pointer:
    name: Point staging at ${{ needs.meta.outputs.sha_tag }}
    needs: [meta, build]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: staging-pointer
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the staging tag to the images just built (no rebuild)
        env:
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
        run: |
          # Never move the pointer backwards: a run that finishes after a newer commit's run leaves
          # the pointer where it is. ADR-018 finding L1: fail closed. A parse error used to be
          # swallowed by `|| true`, which moved the pointer as if there were no existing one; now
          # only "the tag does not exist yet" is treated that way, and any other inspect or parse
          # failure stops the job instead of overwriting a pointer we could not read.
          if inspect_out="$(docker buildx imagetools inspect "${IMAGE_PREFIX}-api:staging" --format '{{ json .Image }}' 2>&1)"; then
            pointer="$(printf '%s' "$inspect_out" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d.get("linux/amd64", d); print(((d.get("config") or {}).get("Labels") or {}).get("org.opencontainers.image.revision", ""))')"
          elif printf '%s' "$inspect_out" | grep -qiE 'not found|manifest unknown|no such manifest'; then
            pointer=""
          else
            echo "::error::could not inspect ${IMAGE_PREFIX}-api:staging: ${inspect_out}"
            exit 1
          fi
          if [ -n "$pointer" ] && [ "$pointer" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$pointer" 2>/dev/null; then
            echo "::notice::staging already points at ${pointer}, which is newer than ${GITHUB_SHA}; left as it is."
            exit 0
          fi
          # imagetools create only points a new tag at the existing manifest; it does not rebuild
          # or re-push content, so the cosign signature made against the sha-<short> digest in the
          # build job already covers whatever tag names that same digest, staging included. Nothing
          # to re-sign here.
          for image in api web proxy; do
            docker buildx imagetools create --tag "${IMAGE_PREFIX}-${image}:staging" "${IMAGE_PREFIX}-${image}:${SHA_TAG}"
          done
          echo "::notice title=Staging pointer::staging now names ${SHA_TAG}; the staging host deploys it within a few minutes (docs/runbooks/deploy.md)."

  promote:
    name: Retag ${{ needs.meta.outputs.sha_tag }} as ${{ needs.meta.outputs.version }}
    needs: meta
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the images built from main (no rebuild)
        env:
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # As in staging-pointer: the version tag names the same manifest digest the build job
          # signed, so cosign verification of the version tag succeeds without re-signing.
          for image in api web proxy; do
            source="${IMAGE_PREFIX}-${image}:${SHA_TAG}"
            if ! docker buildx imagetools inspect "$source" > /dev/null; then
              echo "::error::${source} does not exist. Only a commit built from main can be released."
              exit 1
            fi
            docker buildx imagetools create --tag "${IMAGE_PREFIX}-${image}:${VERSION}" "$source"
          done

  deploy-production:
    name: Deploy to production
    needs: [meta, promote]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - id: host
        env:
          HOST: ${{ secrets.PROD_HOST }}
          KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::notice title=Production not provisioned::PROD_HOST or PROD_SSH_KEY is not set in the production environment. Images ${{ needs.meta.outputs.version }} are tagged; deploy skipped (docs/runbooks/provision-host.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.host.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.host.outputs.configured == 'true'
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.PROD_HOST }}
          ssh-user: ${{ vars.PROD_SSH_USER || 'deploy' }}
          ssh-key: ${{ secrets.PROD_SSH_KEY }}
          known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          image-tag: ${{ needs.meta.outputs.version }}
          registry-user: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
