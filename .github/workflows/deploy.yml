name: Deploy

# The delivery pipeline of ADR-006 and ADR-018 (docs/sdd/10-cicd-pipeline.md):
#
#   push to main  -> build api, web and proxy images ONCE, for linux/amd64 and linux/arm64, tag
#                    sha-<short>, push to GHCR; the maintainer's signer signs each pushed digest (ADR-040)
#                 -> move the `staging` pointer tag to those images. The ARM64 staging host sits
#                    behind a Cloudflare Tunnel and cannot be reached from here: its systemd timer
#                    (deploy/pull-staging.sh) sees the pointer move, verifies the cosign signatures
#                    and deploys the sha-<short> tag the image's labels name (ADR-018). No SSH key,
#                    no inbound access.
#   tag vX.Y.Z    -> no rebuild: the sha-<short> images of the tagged commit are retagged vX.Y.Z (the
#                    cosign signature, made against the manifest digest, already covers the new tag)
#                 -> deploy to the `production` environment (required reviewer: dev lead) over SSH
#
# The production VM is not provisioned yet: its deploy job checks the environment's HOST and
# SSH_KEY secrets and, when either is missing, reports a notice and succeeds.
#
# Only pushes to this repository's main branch and version tags trigger it. Pull requests never do,
# so code from a fork never runs with these secrets or with package write access.
#
# Where the jobs run (ADR-040, which supersedes the hosted-runner rule of ADR-018 finding H1):
#   * meta, build, staging-pointer and promote run on `bms-deploy-laptop`, a runner on Jerome's laptop (the Pi hard-resets under
#     heavy work, ADR-040 amendment 2026-10-18), in an organisation runner group that admits only this workflow, on the
#     staging host under its OWN user (`bmsdeploy`): rootless Docker wiped before and after every job, a
#     network wall, a memory cap, no sudo, no deploy secret (deploy/runner/). The organisation's hosted
#     Actions budget is exhausted and will not be raised, so nothing here may depend on hosted minutes.
#   * Nothing on that runner can sign. The cosign private key lives only in the maintainer's Keychain; a
#     launchd job on the maintainer's Mac (deploy/signer/bms_signer.py) signs the three image digests that
#     the build jobs write in a `bms-image-digest` log line, and only for a run on main. The pointer
#     job moves `staging` only after cosign verifies those signatures with deploy/cosign.pub, because the
#     staging host's puller marks a release failed for good when a signature does not verify.
#   * DEPLOY_RUNS_ON (repository variable, JSON list) overrides where meta, build, staging-pointer and promote run. Unset means
#     the bms-deploy runner above. Set to ["ubuntu-latest"] only while the repository is public (hosted minutes are free then);
#     the signing rule does not change, since nothing on any runner can sign (ADR-040 amendment 2026-10-21).
#   * deploy-production keeps `ubuntu-latest`: it holds the production SSH key, which never goes on a
#     shared runner, and it only runs on a release tag after the production VM exists (ADR-040).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # A push to main that GitHub never turned into a run (22 Oct 2026: #460 and #469 fired no workflow at all) can be
  # deployed by hand from main with `gh workflow run Deploy --ref main`; it builds and points staging exactly as a push does.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/rincoltech-solutions-ltd/bms-platform

jobs:
  meta:
    name: Resolve tags
    if: github.repository == 'RincolTech-Solutions-ltd/bms-platform' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["self-hosted","bms-deploy"]') }}
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Branch protection is not available on this plan, so nothing stops a merge with a placeholder migration number. This is the
      # last gate: every other job needs this one, so no image is built and the staging pointer never moves to a commit that holds a
      # V99 migration (Flyway runs with outOfOrder off: the host would apply V99 and V61 to V98 could never run). Plain shell, so
      # it needs nothing on the runner. .github/scripts/placeholder_migration_guard.py is the same rule.
      - name: Refuse a placeholder migration number (version 99)
        run: |
          # Every spelling Flyway reads as version 99 (V99__, V099__, V99.0__, V99_0__, V99.0.0__), the same pattern as the script.
          # Flyway scans db/migration subfolders and the Java migrations (db/migration under src/main/java) too.
          found="$(find backend/src/main/resources/db/migration backend/src/main/java/db/migration -type f 2>/dev/null | sed 's|.*/||' | grep -E '^V0*99([._]0+)*__' || true)"
          if [ -n "$found" ]; then
            echo "::error::A version 99 placeholder migration is on this commit ($found). Renumber it to the next free number; nothing is built or deployed."
            exit 1
          fi
      - id: tags
        run: |
          commit="$(git rev-parse HEAD)"
          echo "sha_tag=sha-${commit:0:7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release tags are vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME"
              exit 1
            fi
            # Only a commit that reached main (and therefore staging) can be released.
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
              exit 1
            fi
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push ${{ matrix.image }}
    needs: meta
    if: github.ref_type == 'branch'
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["self-hosted","bms-deploy"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
          - image: proxy
            context: deploy
            file: deploy/caddy/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # Every Dockerfile compiles in a stage pinned to $BUILDPLATFORM (Maven, npm and a Go cross-compile
      # run natively), and the per-target runtime stages have no RUN step, so no emulated code ever
      # executes and no QEMU or privileged binfmt registration is needed: the runner's Docker is
      # rootless (ADR-040). The matrix runs one image at a time to stay inside the runner's memory cap.
      - uses: docker/setup-buildx-action@v4
        with:
          # Pinned: the runner host's own buildx (Debian 0.13.1) ignores `imagetools inspect --format`, which the pointer
          # job relies on. The action installs this version per job into ~/.docker, which the hooks wipe (ADR-040).
          version: v0.38.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version and revision labels are what the staging host's puller reads from the
      # `staging` pointer to find the release and the commit of its host files (ADR-018).
      - id: push
        uses: docker/build-push-action@v7
        env:
          # The organisation's free artifact quota (500 MB) is shared by every repository: the build action's per-build
          # record and summary artifacts (about 200 of them, 90 day expiry) helped fill it and blocked AGA's deploys.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.meta.outputs.sha_tag }}
          build-args: GIT_SHA=${{ needs.meta.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.sha_tag }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          # No layer cache on purpose (ADR-040): the GitHub Actions cache is a hosted service (it answered "Our
          # services aren't available right now" and failed the first deploy at the export step), and a registry
          # cache is writable by any workflow with packages: write, so a poisoned layer could enter a signed image.
      # H2, as amended by ADR-040: this job does NOT sign. It records the pushed digest in its own log
      # (a run's log cannot be edited from another run), and the signer on the maintainer's Mac signs
      # image@digest after checking the run: main, this runner, this commit, labels naming this commit.
      - name: Record the pushed digest for the signer
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no digest from the push"; exit 1; }
          # The signer reads this line from the job's own log (not an annotation another workflow could edit).
          echo "::notice title=bms-image-digest::bms-image-digest image=${IMAGE} digest=${DIGEST} revision=${GITHUB_SHA}"

  staging-pointer:
    name: Point staging at ${{ needs.meta.outputs.sha_tag }}
    needs: [meta, build]
    if: github.ref_type == 'branch'
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["self-hosted","bms-deploy"]') }}
    timeout-minutes: 30
    concurrency:
      group: staging-pointer
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
        with:
          # Pinned: the runner host's own buildx (Debian 0.13.1) ignores `imagetools inspect --format`, which the pointer
          # job relies on. The action installs this version per job into ~/.docker, which the hooks wipe (ADR-040).
          version: v0.38.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ADR-040: the signature is made on the maintainer's Mac a few seconds after the build. The staging
      # host marks a release failed for good when a signature does not verify, so the pointer moves only
      # after cosign verifies all three digests here with the same public key the host trusts. If the
      # signer is off, this job times out and the pointer stays where it was: fail closed.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"
      - name: Wait for the signatures
        env:
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
        run: |
          : > verified-digests.txt
          deadline=$((SECONDS + 1500))   # one shared 25 minute budget for all three images
          for image in api web proxy; do
            ref="${IMAGE_PREFIX}-${image}:${SHA_TAG}"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')"
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no digest for $ref"; exit 1; }
            ok=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              if err="$(cosign verify --key deploy/cosign.pub --insecure-ignore-tlog=true "${IMAGE_PREFIX}-${image}@${digest}" 2>&1 > /dev/null)"; then ok=yes; break; fi
              sleep 20
            done
            if [ -z "$ok" ]; then
              echo "::error::${image}@${digest} was not signed in time (last cosign message: $(printf '%s' "$err" | tail -1 | cut -c1-160)): is the signer on the maintainer's Mac running? (docs/runbooks/deploy-signer.md)"
              exit 1
            fi
            echo "${image} ${digest}" >> verified-digests.txt
            echo "::notice::${image} signed: ${digest}"
          done
      - name: Move the staging tag to the images just built (no rebuild)
        env:
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
        run: |
          # Never move the pointer backwards: a run that finishes after a newer commit's run leaves
          # the pointer where it is. ADR-018 finding L1: fail closed. A parse error used to be
          # swallowed by `|| true`, which moved the pointer as if there were no existing one; now
          # only "the tag does not exist yet" is treated that way, and any other inspect or parse
          # failure stops the job instead of overwriting a pointer we could not read.
          if inspect_out="$(docker buildx imagetools inspect "${IMAGE_PREFIX}-api:staging" --format '{{ json .Image }}' 2>&1)"; then
            pointer="$(printf '%s' "$inspect_out" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d.get("linux/amd64", d); print(((d.get("config") or {}).get("Labels") or {}).get("org.opencontainers.image.revision", ""))')"
          elif printf '%s' "$inspect_out" | grep -qiE 'not found|manifest unknown|no such manifest'; then
            pointer=""
          else
            echo "::error::could not inspect ${IMAGE_PREFIX}-api:staging: ${inspect_out}"
            exit 1
          fi
          if [ -n "$pointer" ] && [ "$pointer" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$pointer" 2>/dev/null; then
            echo "::notice::staging already points at ${pointer}, which is newer than ${GITHUB_SHA}; left as it is."
            exit 0
          fi
          # imagetools create only points a new tag at the existing manifest; it does not rebuild
          # or re-push content, so the cosign signature made against the sha-<short> digest in the
          # build job already covers whatever tag names that same digest, staging included. Nothing
          # to re-sign here.
          # Created from the DIGESTS verified above, never from the mutable sha tag: a tag swapped after the
          # verification cannot reach the pointer (ADR-040).
          while read -r image digest; do
            docker buildx imagetools create --tag "${IMAGE_PREFIX}-${image}:staging" "${IMAGE_PREFIX}-${image}@${digest}" < /dev/null
          done < verified-digests.txt
          echo "::notice title=Staging pointer::staging now names ${SHA_TAG}; the staging host deploys it within a few minutes (docs/runbooks/deploy.md)."

  promote:
    name: Retag ${{ needs.meta.outputs.sha_tag }} as ${{ needs.meta.outputs.version }}
    needs: meta
    if: github.ref_type == 'tag'
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["self-hosted","bms-deploy"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
        with:
          # Pinned: the runner host's own buildx (Debian 0.13.1) ignores `imagetools inspect --format`, which the pointer
          # job relies on. The action installs this version per job into ~/.docker, which the hooks wipe (ADR-040).
          version: v0.38.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag the images built from main (no rebuild)
        env:
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # As in staging-pointer: the version tag names the same manifest digest the build job
          # signed, so cosign verification of the version tag succeeds without re-signing.
          for image in api web proxy; do
            source="${IMAGE_PREFIX}-${image}:${SHA_TAG}"
            if ! docker buildx imagetools inspect "$source" > /dev/null; then
              echo "::error::${source} does not exist. Only a commit built from main can be released."
              exit 1
            fi
            docker buildx imagetools create --tag "${IMAGE_PREFIX}-${image}:${VERSION}" "$source"
          done

  deploy-production:
    name: Deploy to production
    needs: [meta, promote]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - id: host
        env:
          HOST: ${{ secrets.PROD_HOST }}
          KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::notice title=Production not provisioned::PROD_HOST or PROD_SSH_KEY is not set in the production environment. Images ${{ needs.meta.outputs.version }} are tagged; deploy skipped (docs/runbooks/provision-host.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.host.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.host.outputs.configured == 'true'
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.PROD_HOST }}
          ssh-user: ${{ vars.PROD_SSH_USER || 'deploy' }}
          ssh-key: ${{ secrets.PROD_SSH_KEY }}
          known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          image-tag: ${{ needs.meta.outputs.version }}
          registry-user: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
