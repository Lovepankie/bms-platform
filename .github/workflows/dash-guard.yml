name: dash-guard

# Fails a PR if any changed text file contains an em dash or en dash. The
# no-dash house rule (AI-detection, distribution-bound docs) was previously
# enforced only by a local Claude Code hook on the Dev Lead's machine, so
# teammate-authored content bypassed it. This runs in CI for every PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dash-guard:
    runs-on: [self-hosted, hillary-pi]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject em/en dashes in changed files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # changed, still-present text files (skip deletions and binaries)
          files=$(git diff --name-only --diff-filter=d "$base" "$head" \
            | grep -iE '\.(md|txt|yml|yaml|dsl|java|dart|ts|tsx|js|py|json)$' || true)
          bad=0
          for f in $files; do
            [ -f "$f" ] || continue
            if grep -nP '[\x{2014}\x{2013}]' "$f"; then
              echo "::error file=$f::em/en dash found. Use commas, colons or hyphens (house style)."
              bad=1
            fi
          done
          if [ "$bad" -eq 1 ]; then
            echo "::error::Remove em/en dashes from the flagged files before merging."
            exit 1
          fi
          echo "No em/en dashes in changed files. Guard passes."
