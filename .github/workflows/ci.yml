name: CI

# Every pull request and every push to main (docs/sdd/10-cicd-pipeline.md section 10.3).
# pull_request, never pull_request_target: a run for a pull request from a fork gets a read-only
# token and no secrets, and nothing here pushes anything.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit and architecture tests (Surefire), formatting (Spotless), then the integration
      # tests against PostgreSQL 16 in Testcontainers (Failsafe): RLS isolation, ledger
      # invariants, members API, actuator exposure, route permissions, OpenAPI snapshot.
      - name: Build and test
        run: mvn -B verify
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 14

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typed API client matches the committed contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts is stale; run 'make openapi' and commit it."; exit 1; }
      - run: npm run lint
      - run: npm test
      - run: npm run build

  delivery:
    name: Workflows, scripts and compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/postgres/initdb/*.sh
      - name: Compose files parse
        env:
          IMAGE_TAG: sha-0000000
          POSTGRES_IMAGE: postgres:16.15-alpine
          POSTGRES_SUPERUSER_PASSWORD: ci-placeholder
          BMS_OWNER_PASSWORD: ci-placeholder
          BMS_APP_PASSWORD: ci-placeholder
          BMS_TENANT_HOST_PATTERN: "{slug}-bms-staging.rincoltech.com"
          BMS_PLATFORM_HOST: bms-staging.rincoltech.com
          BMS_DNS_ZONE: rincoltech.com
          BMS_CALLBACK_HOST: bms-staging-callbacks.rincoltech.com
          ACME_EMAIL: ops@bms.example
          CLOUDFLARE_API_TOKEN: ci-placeholder
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
          CLOUDFLARED_IMAGE: cloudflare/cloudflared:2026.9.3
          BMS_TOKEN_SIGNING_JWK: ci-placeholder
          BMS_DATA_KEY: ci-placeholder
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.pi-staging.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
      - name: systemd units parse
        run: |
          for unit in deploy/systemd/*; do
            grep -Eq '^\[(Unit|Service|Timer|Slice)\]' "$unit" || { echo "::error::$unit has no unit section"; exit 1; }
          done
          systemd-analyze verify deploy/systemd/bms.slice deploy/systemd/bms-pull.timer
