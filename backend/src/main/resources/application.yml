# Every value that differs per environment comes from an environment variable listed in
# .env.example at the repository root. Nothing secret has a default here.
spring:
  application:
    name: bms-api
  # Uploads (chapter 8 section 8.8): 5 MB per file; the request allows for the form overhead.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    # The API always connects as bms_app: NOSUPERUSER, NOBYPASSRLS, owns nothing (ADR-003).
    # DatabaseRoleGuard refuses to start otherwise (NFR-SEC-03).
    url: ${BMS_DB_URL:jdbc:postgresql://localhost:5432/bms}
    username: ${BMS_APP_USER:bms_app}
    password: ${BMS_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${BMS_DB_POOL_SIZE:10}
      # Every connection of the pool starts with these limits (issue #107, ADR-028): a runaway
      # statement or a transaction left open cannot hold a connection, or the row locks it took, for
      # ever. Well above the slowest report measured at 25 times the staging data.
      data-source-properties:
        options: >-
          -c statement_timeout=${BMS_DB_STATEMENT_TIMEOUT:60s}
          -c idle_in_transaction_session_timeout=${BMS_DB_IDLE_IN_TRANSACTION_TIMEOUT:60s}
  # Migrations never run on application start: the one-shot `migrate` command runs them as
  # bms_owner before the application containers switch (ADR-006). spring-boot-flyway is not on
  # the classpath, so there is no Flyway auto-configuration to switch off.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    # Jackson 3 already writes dates and instants as ISO-8601 strings.
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  modulith:
    # Modules are the packages annotated with @ApplicationModule (kernel, core.*, lending.*).
    detection-strategy: explicitly-annotated

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    # Read past an over-limit upload so the client gets the 413 file_too_large body instead of a
    # reset connection; the 6 MB request cap still bounds it (chapter 8 section 8.8).
    max-swallow-size: 8MB
    remoteip:
      # ADR-018 finding M1: the native strategy installs Tomcat's RemoteIpValve, whose host-header
      # defaults to X-Forwarded-Host and is trusted from the private Docker network the tunnel's
      # Caddy runs on. Tenant and platform host resolution must read only Host, so this names a
      # header nothing ever sends: getServerName() can no longer be overridden by a client-supplied
      # X-Forwarded-Host, on staging or anywhere else.
      host-header: x-bms-unused-forwarded-host
  error:
    whitelabel:
      enabled: false

# Actuator is locked down. The management port (8081) is never published outside the container
# network. On the application port only /healthz (liveness) and /readyz (readiness) exist, with
# no details. Every other endpoint is disabled, not merely unexposed.
management:
  server:
    port: ${BMS_MANAGEMENT_PORT:8081}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: "server:/healthz"
        readiness:
          include: readinessState,db,migrations
          additional-path: "server:/readyz"
    info:
      access: read-only
  info:
    git:
      mode: simple
    env:
      enabled: true

info:
  app:
    git-sha: ${BMS_GIT_SHA:}

springdoc:
  api-docs:
    path: /api/v1/openapi.json
    enabled: ${BMS_OPENAPI_ENABLED:true}
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  show-actuator: false
  packages-to-scan: com.rincoltech.bms

bms:
  git-sha: ${BMS_GIT_SHA:}
  tenancy:
    # Chapter 7 section 7.2. Required outside the dev and test profiles; startup fails on a missing
    # or invalid value. Tenant hosts are one label under the zone, for example
    # {slug}-bms-staging.rincoltech.com; the platform console has its own host.
    tenant-host-pattern: ${BMS_TENANT_HOST_PATTERN:}
    platform-host: ${BMS_PLATFORM_HOST:}
    # Only the dev and test profiles may set this; startup fails otherwise (chapter 7 section 7.2).
    allow-tenant-header: ${ALLOW_TENANT_HEADER:false}
  auth:
    # Signed-in sessions (bearer access tokens) work in every mode (ADR-014).
    # none: nothing else. dev: also the header stub of chapter 7 section 7.4.3; dev and test only.
    mode: ${AUTH_MODE:none}
    # Access token signing key, an EC P-256 private JWK with a kid; required outside dev and test.
    # Generate with: java -jar bms-api.jar keys
    signing-jwk: ${BMS_TOKEN_SIGNING_JWK:}
    # Application data key (32 bytes, base64) and its id; encrypts TOTP secrets (chapter 8 section 8.7).
    data-key: ${BMS_DATA_KEY:}
    data-key-id: ${BMS_DATA_KEY_ID:k1}
    # Retired data keys (id:base64, comma separated), kept only until every row sealed with them is re-sealed (docs/runbooks/payments.md).
    previous-data-keys: ${BMS_DATA_KEY_PREVIOUS:}
    # FAILED sign-in requests from one client IP in 10 minutes, on every public sign-in, two-step, invitation and setup
    # route (ADR-059); a success costs nothing. The lock per address and per account is in the database, fixed in code.
    sign-in-failures-per-ip: ${BMS_AUTH_SIGN_IN_FAILURES_PER_IP:300}
    # argon2id hashes at once (64 MiB each at the production cost); a caller that waits 2 s gets 503 sign_in_busy.
    argon2-max-concurrent: ${BMS_AUTH_ARGON2_MAX_CONCURRENT:4}
  database:
    role-guard: true
  # Documents (chapter 12 section 12.5). r2 on servers; fake (in memory, self-signed URLs) only in
  # the dev and test profiles, and startup fails otherwise.
  storage:
    provider: ${OBJECT_STORAGE:r2}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_DOCUMENTS_ACCESS_KEY_ID:}
      secret-access-key: ${R2_DOCUMENTS_SECRET_ACCESS_KEY:}
      bucket: ${R2_DOCUMENTS_BUCKET:}
  # Report runs (ADR-038, docs/specs/client-extras.md sections 6 and 9.1). Not secrets. These are the production
  # defaults; the staging host (a 448 MB container with about 224 MB of heap) sets 1 run, 20000 rows and 8 MiB.
  reports:
    # Runs executing at once across the platform.
    max-concurrent-runs: ${BMS_REPORTS_MAX_CONCURRENT_RUNS:2}
    # Rows in the largest table of one output (an Excel sheet, a CSV section, a JSON table).
    xlsx-row-cap: ${BMS_REPORTS_XLSX_ROW_CAP:200000}
    # Rows of one table in a PDF; a longer table is cut with a note that the full detail is in the Excel file.
    pdf-row-cap: ${BMS_REPORTS_PDF_ROW_CAP:3000}
    # Bytes of one output file.
    max-file-bytes: ${BMS_REPORTS_MAX_FILE_BYTES:67108864}
    # Where a run's spool files live while it runs; empty means a folder in the system temp directory.
    spool-dir: ${BMS_REPORTS_SPOOL_DIR:}
  # Outbox senders (spec section 11, chapter 9 section 9.8). A sender whose values are unset is off:
  # its rows stay pending and nothing fails. SMTP is implicit TLS (465); 587 is blocked on the
  # staging host. Never logged.
  notifications:
    smtp:
      host: ${BMS_SMTP_HOST:}
      port: ${BMS_SMTP_PORT:465}
      user: ${BMS_SMTP_USER:}
      password: ${BMS_SMTP_PASSWORD:}
      from: ${BMS_MAIL_FROM:}
    telegram:
      bot-token: ${BMS_TELEGRAM_BOT_TOKEN:}
      operator-chat-id: ${BMS_TELEGRAM_OPERATOR_CHAT_ID:}
    # The support line in the footer of every email (issue #396, ADR-054), for example an address and a phone number.
    # Empty by default: the line is left out. Never hard-coded.
    support-contact: ${BMS_SUPPORT_CONTACT:}
  # Web Push (ADR-050, docs/runbooks/push-notifications.md). Off unless both VAPID keys are set; the subject is a mailto: address or an
  # https: URL the push services can reach. Never logged. Generate the pair with: npx web-push generate-vapid-keys (docs/runbooks/push-notifications.md).
  push:
    vapid-public-key: ${BMS_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${BMS_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${BMS_PUSH_SUBJECT:}
    extra-endpoint-hosts: ${BMS_PUSH_EXTRA_ENDPOINT_HOSTS:}
    # Development and tests only (the dev profile sets it): a key pair made at start. Startup refuses it on staging and production.
    ephemeral-keys: false
  # SMS (ADR-036, spec section 4.4). Nothing here sends by default: the mode is off (sink on staging), and
  # startup refuses any combination that could text a real phone from outside production. The API
  # key is never logged. BMS_ENVIRONMENT is staging or production; unset is treated as not production.
  environment: ${BMS_ENVIRONMENT:}
  sms:
    provider: ${BMS_SMS_PROVIDER:}
    mode: ${BMS_SMS_MODE:}
    allowlist: ${BMS_SMS_ALLOWLIST:}
    platform-daily-cap: ${BMS_SMS_PLATFORM_DAILY_CAP:2000}
    africas-talking:
      base-url: ${BMS_SMS_AT_BASE_URL:}
      username: ${BMS_SMS_AT_USERNAME:}
      api-key: ${BMS_SMS_AT_API_KEY:}
  # Language model gateway (ADR-037, chapter 9 section 9.8). Off unless BMS_AI_PROVIDER=openai_compatible and
  # the base URL, key and model are all set; an incomplete setting is off, never a startup failure. The
  # recording stub is for the dev and test profiles only. Prices are operations configuration, in micro-units
  # of the price currency per million tokens, and never in the repository. Never logged.
  ai:
    provider: ${BMS_AI_PROVIDER:off}
    base-url: ${BMS_AI_BASE_URL:}
    api-key: ${BMS_AI_API_KEY:}
    model: ${BMS_AI_MODEL:}
    budget-seconds: ${BMS_AI_BUDGET_SECONDS:30}
    max-tokens-per-call: ${BMS_AI_MAX_TOKENS_PER_CALL:800}
    max-input-tokens-per-call: ${BMS_AI_MAX_INPUT_TOKENS_PER_CALL:8000}
    platform-daily-tokens: ${BMS_AI_PLATFORM_DAILY_TOKENS:200000}
    platform-daily-cost-micro: ${BMS_AI_PLATFORM_DAILY_COST_MICRO:2000000}
    tenant-daily-tokens: ${BMS_AI_TENANT_DAILY_TOKENS:20000}
    tenant-daily-cost-micro: ${BMS_AI_TENANT_DAILY_COST_MICRO:500000}
    price-input-micro-per-million: ${BMS_AI_PRICE_INPUT_MICRO_PER_MILLION:0}
    price-output-micro-per-million: ${BMS_AI_PRICE_OUTPUT_MICRO_PER_MILLION:0}
    price-currency: ${BMS_AI_PRICE_CURRENCY:USD}
    enabled-tenants: ${BMS_AI_ENABLED_TENANTS:}
  # JUSTIFICATION-A3: the two new configuration groups (bms.pesapal, bms.payments) for slice #213 are new settings, not wrapped code.
  # Payment collections through Pesapal (ADR-035, spec 3.11). Nothing here collects by default: with no credentials the
  # gateway is off, and startup refuses any base URL that could reach the live provider from outside production (only the
  # sandbox is allowed there, in every mode) and the fake provider in production. Keys, secrets and path tokens come from
  # the host environment only and are never logged. A lender's own account is entered by the lender and stored encrypted (issue #233), so there is no per-lender value here.
  pesapal:
    provider: ${BMS_PESAPAL_PROVIDER:}
    base-url: ${BMS_PESAPAL_BASE_URL:}
    callback-base-url: ${BMS_PESAPAL_CALLBACK_BASE_URL:}
    # SHA-256 (hex, comma separated) of every consumer key the platform operator owns, current and retired: no lender may enter one
    # as its own account. Production refuses to start with the gateway on and this empty (docs/runbooks/payments.md).
    refused-key-digests: ${BMS_PESAPAL_REFUSED_KEY_DIGESTS:}
    platform:
      consumer-key: ${BMS_PESAPAL_PLATFORM_CONSUMER_KEY:}
      consumer-secret: ${BMS_PESAPAL_PLATFORM_CONSUMER_SECRET:}
      ipn-id: ${BMS_PESAPAL_PLATFORM_IPN_ID:}
      ipn-token: ${BMS_PESAPAL_PLATFORM_IPN_TOKEN:}
  # Payment jobs and the public notification endpoints (not secrets).
  payments:
    poll-per-tenant: ${BMS_PAYMENTS_POLL_PER_TENANT:5}
    poll-total: ${BMS_PAYMENTS_POLL_TOTAL:40}
    callback-ip-per-minute: ${BMS_PAYMENTS_CALLBACK_IP_PER_MINUTE:60}
    callback-global-per-minute: ${BMS_PAYMENTS_CALLBACK_GLOBAL_PER_MINUTE:3000}
    max-body-bytes: ${BMS_PAYMENTS_MAX_BODY_BYTES:4096}
  # Sign-up volume bounds (chapter 7 section 7.10), counted in the database: over a bound a request
  # is answered 202 and nothing is created or sent; the global caps alert the operator once an hour.
  onboarding:
    max-applications-per-hour: ${BMS_SIGNUP_MAX_APPLICATIONS_PER_HOUR:30}
    max-verification-emails-per-hour: ${BMS_SIGNUP_MAX_VERIFICATION_EMAILS_PER_HOUR:60}
    max-verification-emails-per-mailbox: 3
  # The nightly arrears run (FR-ARR-01, lending.loan-arrears, every quarter hour). On by default; the integration
  # tests switch it off so that a tick never charges penalties on a test's loans, and drive the run themselves.
  lending:
    arrears-job-enabled: ${BMS_LENDING_ARREARS_JOB_ENABLED:true}
  # Subscription billing (issue #480, ADR-075): the reminders and the overdue move, every quarter hour. Nothing is ever
  # suspended by it. On by default; the integration tests switch it off and call the run themselves. The SMS reminder to
  # the Owner goes only when sms-enabled is true (and then through the SMS channel's own checks). The receipt's issuer
  # details are environment values, never repository content.
  platform:
    billing-job-enabled: ${BMS_PLATFORM_BILLING_JOB_ENABLED:true}
    billing:
      sms-enabled: ${BMS_PLATFORM_BILLING_SMS_ENABLED:false}
      issuer-name: ${BMS_PLATFORM_BILLING_ISSUER_NAME:Rincol Tech}
      issuer-address: ${BMS_PLATFORM_BILLING_ISSUER_ADDRESS:}
      issuer-contact: ${BMS_PLATFORM_BILLING_ISSUER_CONTACT:}
      issuer-tax-id: ${BMS_PLATFORM_BILLING_ISSUER_TAX_ID:}

# Background jobs on PostgreSQL (ADR-008). BMS_SCHEDULER_ENABLED=false turns polling off in an
# instance that should only serve HTTP, if a separate worker instance is ever split out.
db-scheduler:
  enabled: ${BMS_SCHEDULER_ENABLED:true}
  table-name: scheduled_tasks
  threads: 4
  polling-interval: 10s
  delay-startup-until-context-ready: true

---
spring:
  config:
    activate:
      on-profile: server
# Staging and production: JSON logs with request_id in every line (NFR-OBS-01). Every string of every line (message,
# exception, stack trace, MDC) passes through the redaction filter first (NFR-SEC-08, ADR-059, issue #426).
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: com.rincoltech.bms.kernel.LogRedaction
