<!--
  Shared letterhead of every generated document (ADR-034 quality bar, items 1, 2, 5 and 6): the
  tenant logo and business details on the left, the branch address, the document number and date
  right aligned, a full-width rule in the brand colour, the centred title; a running footer with
  the receipt footer text, the number again and page x of y. A4 with print margins; Open Sans
  embedded by the renderer.
-->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <style th:inline="text">
    @page {
      size: [[${doc['landscape'] != null ? 'A4 landscape' : 'A4'}]];
      margin: [[${doc['voided'] != null ? '45mm' : '37mm'}]] 15mm 22mm 15mm;
      @top-center { content: element(letterhead); }
      @bottom-center { content: element(pagefoot); }
    }
    body { font-family: 'Open Sans'; font-size: 9.5pt; color: #333333; margin: 0; }
    #letterhead { position: running(letterhead); }
    #pagefoot { position: running(pagefoot); }
    .head { width: 100%; border-collapse: collapse; }
    .head td { vertical-align: top; padding: 0; }
    .logo { max-height: 15mm; max-width: 32mm; }
    td.logocell { width: 36mm; padding-right: 3mm; vertical-align: middle; }
    .business { font-weight: 700; font-size: 12pt; color: #222222; }
    .muted { color: #666666; }
    .docline { text-align: right; font-size: 9pt; }
    .docline .no { font-weight: 700; font-size: 10.5pt; color: #222222; }
    .rule { border-bottom: 1.2mm solid [[${lh.colour}]]; margin: 2.5mm 0 0 0; }
    h1 { text-align: center; color: [[${lh.colour}]]; font-size: 15pt; letter-spacing: 1.5pt; margin: 1mm 0 4mm 0; font-weight: 700; }
    h2 { color: [[${lh.colour}]]; font-size: 10.5pt; margin: 5mm 0 2mm 0; font-weight: 600; }
    table.grid { width: 100%; border-collapse: collapse; -fs-table-paginate: paginate; }
    table.grid thead { display: table-header-group; }
    table.grid th { background: [[${lh.colour}]]; color: [[${lh.onColour}]]; font-weight: 600; text-align: left; padding: 1.6mm 2mm; font-size: 8.5pt; }
    table.grid td { padding: 1.4mm 2mm; border-bottom: 0.2mm solid #E3E3E3; }
    table.grid tr { page-break-inside: avoid; }
    table.grid tbody tr:nth-child(even) td { background: [[${lh.tint}]]; }
    table.grid tr.note td { font-size: 8.5pt; font-style: italic; color: #666666; }
    table.grid tbody tr.total td { font-weight: 700; border-top: 0.5mm solid [[${lh.colour}]]; border-bottom: 0.5mm solid [[${lh.colour}]]; background: #FFFFFF; }
    .num { text-align: right; white-space: nowrap; }
    table.grid th.num { text-align: right; }
    table.facts { width: 100%; border-collapse: collapse; }
    table.facts td { padding: 1.1mm 0; vertical-align: top; }
    table.facts td.k { color: #666666; width: 38%; }
    .amount { font-size: 17pt; font-weight: 700; color: #222222; }
    .words { font-style: italic; color: #444444; margin-top: 1mm; }
    .box { border: 0.3mm solid #D5D5D5; padding: 3mm 4mm; margin: 2mm 0 4mm 0; }
    table.signs { width: 100%; border-collapse: collapse; margin-top: 10mm; page-break-inside: avoid; }
    table.signs td { vertical-align: bottom; width: 33%; padding: 0 6mm 0 0; }
    table.signs td.last { padding-right: 0; }
    .signline { border-top: 0.3mm solid #555555; padding-top: 1mm; font-size: 8.5pt; }
    .verify { width: 26mm; height: 26mm; }
    .void { border: 0.8mm solid #B00020; color: #B00020; font-weight: 700; font-size: 10pt; text-align: center; padding: 1.2mm 2mm; margin-top: 2mm; }
    .party { font-weight: 700; font-size: 11pt; color: #222222; }
    .strong { font-weight: 700; color: #222222; }
    .tick { width: 4mm; height: 4mm; border: 0.3mm solid #888888; margin: 0 auto; }
    .remarks { height: 14mm; border-bottom: 0.3mm solid #999999; margin-bottom: 2mm; }
    .foot { width: 100%; border-collapse: collapse; font-size: 7.5pt; color: #777777; border-top: 0.3mm solid #DDDDDD; }
    .foot td { padding-top: 1.5mm; vertical-align: top; }
    .pageinfo:before { content: "page " counter(page) " of " counter(pages); }
  </style>
</head>
<body>
  <div th:fragment="letterhead" id="letterhead">
    <table class="head">
      <tr>
        <td th:if="${lh.logo != null}" class="logocell"><img class="logo" th:src="${lh.logo}" alt=""/></td>
        <td>
          <div class="business" th:text="${lh.name}">Business</div>
          <div class="muted" th:text="${branch.name}">Branch</div>
          <div class="muted" th:if="${branch.location != null}" th:text="${branch.location}">Address</div>
        </td>
        <td class="docline" style="width: 38%;">
          <div class="no" th:text="${doc.number}">RC-HQ-000001</div>
          <div th:text="${doc.date}">16 Mar 2026</div>
        </td>
      </tr>
    </table>
    <div class="rule"></div>
    <div th:if="${doc['voided'] != null}" class="void" th:text="${doc['voided']}">VOID</div>
  </div>
  <div th:fragment="pagefoot" id="pagefoot">
    <table class="foot">
      <tr>
        <td style="width: 65%;" th:text="${lh.footer}">Footer</td>
        <td style="text-align: right;"><span th:text="${doc.number}">RC-HQ-000001</span>, <span class="pageinfo"></span></td>
      </tr>
    </table>
  </div>
</body>
</html>
