<!-- FR-DOC-01 repayment schedule as at the business date: every instalment with what is due, paid and outstanding; the header row repeats on each page. -->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
  <div th:replace="~{layout :: letterhead}"></div>
  <div th:replace="~{layout :: pagefoot}"></div>
  <h1 th:text="${doc.title}">LOAN SCHEDULE</h1>

  <table class="facts">
    <tr><td class="k">Member</td><td th:text="${member.name + ' (' + member.number + ')'}">Member</td></tr>
    <tr><td class="k">Loan</td><td th:text="${loan.number + ', ' + loan.product}">Loan</td></tr>
    <tr><td class="k">Terms</td><td th:text="${loan.terms}">Terms</td></tr>
    <tr><td class="k">Disbursed</td><td th:text="${loan.disbursed}">Date</td></tr>
    <tr><td class="k">As at</td><td th:text="${doc.date}">Date</td></tr>
  </table>

  <h2 th:text="${'Instalments (' + loan.currency + ')'}">Instalments</h2>
  <table class="grid">
    <thead><tr><th>No</th><th>Due date</th><th class="num">Principal</th><th class="num">Interest</th><th class="num">Fees</th><th class="num">Total due</th><th class="num">Paid</th><th class="num">Outstanding</th><th>Status</th></tr></thead>
    <tbody>
      <tr th:each="r : ${rows}">
        <td th:text="${r.no}">1</td><td th:text="${r.dueDate}">date</td><td class="num" th:text="${r.principal}">0</td><td class="num" th:text="${r.interest}">0</td><td class="num" th:text="${r.fees}">0</td><td class="num" th:text="${r.total}">0</td><td class="num" th:text="${r.paid}">0</td><td class="num" th:text="${r.outstanding}">0</td><td th:text="${r.status}">pending</td>
      </tr>
    </tbody>
    <tbody><tr class="total"><td colspan="2">Totals</td><td class="num" th:text="${totals.principal}">0</td><td class="num" th:text="${totals.interest}">0</td><td class="num" th:text="${totals.fees}">0</td><td class="num" th:text="${totals.total}">0</td><td class="num" th:text="${totals.paid}">0</td><td class="num" th:text="${totals.outstanding}">0</td><td></td></tr></tbody>
  </table>
  <div class="words" th:text="${'Outstanding: ' + totals.outstandingWords}">Outstanding in words</div>
</body>
</html>
