# Local development only (make dev, docker-compose.yml). Never set on staging or production:
# both switches below refuse to start outside the dev and test profiles.
bms:
  tenancy:
    # http://demo.localhost:8000 is the demo tenant; localhost is the platform host (make dev).
    tenant-host-pattern: "{slug}.localhost"
    platform-host: localhost
    allow-tenant-header: true
    # One-time links point at the local proxy (make dev), not https.
    link-scheme: http
    link-port: 8000
  auth:
    mode: dev
  storage:
    provider: fake
  push:
    # A key pair made at every start, so notifications can be tried locally without setting up keys (ADR-050).
    ephemeral-keys: true
