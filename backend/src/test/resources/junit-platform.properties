# Issue #852: a test method or lifecycle method that hangs (a lock wait that never ends) fails after 15 minutes under its
# own name, instead of holding the whole run until the job is cancelled. The longest tests (MigrationOrderIT's
# container cases) take a few minutes.
junit.jupiter.execution.timeout.default = 15 m

# jqwik, the property tests' engine (issue #137, SDD chapter 15 section 15.3.1). Every property names its own seed and its
# tries, so a run is the same on every machine. The failure database lives under target, never in the source tree, and a
# failed sample is not tried first on the next run, so the run stays the one its seed gives. Shrinking a counterexample is
# bounded: the import properties run a commit per try, so an unbounded shrink could hold the job for hours.
jqwik.database = target/jqwik-database
jqwik.failures.runfirst = false
jqwik.seeds.whenfixed = ALLOW
jqwik.shrinking.bounded.seconds = 120
jqwik.reporting.onlyfailures = true
