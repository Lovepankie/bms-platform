spring:
  datasource:
    hikari:
      # Every distinct test context (a @Import, a spy bean) is cached with its own pool. A small
      # pool that keeps no idle connections lets the cached contexts of the whole suite share the
      # test database's connection slots.
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 10000

bms:
  tenancy:
    # Hyphenated hosts under one zone, as on staging (ADR-018). TestRestTemplate calls localhost,
    # which is the platform host here.
    tenant-host-pattern: "{slug}-bms-staging.rincoltech.test"
    platform-host: localhost
    allow-tenant-header: true
  auth:
    mode: dev
    # The whole suite signs in from one address, and AuthConcurrencyIT races twenty sign-ins at once: neither the
    # per-IP failure limit nor the bound on parallel hashes (ADR-059) may refuse them. AuthThrottleTest and
    # PasswordsBoundTest prove both limits; SignInLimitsIT lowers the per-IP limit for a moment.
    sign-in-failures-per-ip: 1000000
    argon2-max-concurrent: 64
  storage:
    provider: fake
    # Fixed so a test can sign an expired URL itself (FR-DOC-03).
    fake-secret: test-only-fake-storage-secret
    # argon2id at test cost. The PHC string carries its parameters, so every hash still verifies;
    # other profiles use the chapter 8 cost (64 MiB, 3 iterations).
    argon2-memory-kib: 4096
    argon2-iterations: 2
  # High global caps, so the whole suite's sign-ups fit in one hour; OnboardingIT fills them on
  # purpose to prove the cap.
  onboarding:
    max-applications-per-hour: 400
    max-verification-emails-per-hour: 400

management:
  server:
    port: 0

# No recurring job runs in a test context (issue #530). Every cached context shares one database and one
# scheduled_tasks table, so a scheduler left running in one context ticks wall-clock jobs across the tenants of
# whatever test runs next (#487). The task beans still exist; a test calls the job's work itself, or turns the
# scheduler back on with @TestPropertySource(properties = "db-scheduler.enabled=true"). RecurringJobsOffIT guards it.
db-scheduler:
  enabled: false
